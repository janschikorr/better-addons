# Hand-written manifest, phase 2, format 2. Read against ClassicUI Forever 0.41.1.
#
# ClassicUI restores the Classic look, and almost every part is a separate toggle
# that defaults to on. It retextures existing Blizzard frames - aspect style -
# rather than replacing them, except for the action bar and the quest watch,
# where it supplies frames of its own. Art/ThemeParts.lua holds its own
# module-to-frame table, which is exactly the mapping this project builds in
# mapping/.
format: 2
addon: ClassicUIForever
toc: ClassicUIForever.toc
versions: ">=0.41.0"
interface: [16001, 120100, 120105, 120107]
title: ClassicUI Forever

provides:
  - slot: ui
    aspect: style
    via: retexture
    kind: modify
    source: "ClassicUIForever/Art/ThemeParts.lua:99 PART_KEYS"
    reason: >
      The theme as a whole, claimed at the parent slot. By the hierarchy rule
      this covers every ui.* part, so the unit frames, cast bars, nameplates,
      micro menu, bag bar and experience bars are no longer listed one by one -
      in format 1 they were, which stated the same thing twice.
    note: >
      The parts it covers, from ThemeParts.lua:76-91: themePartUnits (PlayerFrame,
      TargetFrame, FocusFrame, PetFrame, PartyFrame), themePartCastBars,
      themePartNameplates, themePartBars, themePartMicroMenu, themePartBagBar,
      themePartXPBars.

  - slot: ui.actionbar.layout
    aspect: content
    via: replace-frame
    kind: replace
    optional: true
    module: classicBar
    source: "ClassicUIForever/Art/GameArt.lua:275 classicBar: MainActionBar, BagsBar, MicroMenuContainer, StatusTrackingBarManager"
    reason: >
      The gryphon bar is a frame of its own, not a retexture, so this is a
      content replacement and overrides the style claim on the parent.

  - slot: minimap.layout
    aspect: style
    via: retexture
    kind: modify
    optional: true
    module: themePartMinimap
    source: "ClassicUIForever/Art/ThemeParts.lua:81 themePartMinimap: MinimapCluster, Minimap"
    note: >
      Also adds a frame of its own, ForeverClassicUIMinimapBag, inside the
      cluster. MoveAny moves the same slot; different aspects, so compatible.

  - slot: tooltip.frame
    aspect: style
    via: retexture
    kind: modify
    optional: true
    module: themePartTooltips
    source: "ClassicUIForever/Art/ThemeParts.lua:88 themePartTooltips: GameTooltip and the shopping tooltips"

  - slot: chat.frame
    aspect: style
    via: retexture
    kind: modify
    optional: true
    module: themePartChat
    source: "ClassicUIForever/Art/ThemeParts.lua:63 ChatFrame%d -> themePartChat, and :89"

  - slot: quest.tracker
    aspect: content
    via: replace-frame
    kind: replace
    optional: true
    module: themePartQuestTracker
    source: "ClassicUIForever/Art/ThemeParts.lua:90 themePartQuestTracker: ObjectiveTrackerFrame, ForeverClassicUIQuestWatch"
    reason: >
      Supplies its own watch frame, so this replaces content rather than
      restyling it. Addons that only write lines into the tracker occupy
      quest.tracker.lines and are unaffected.

  - slot: profession.frame
    aspect: style
    via: retexture
    kind: modify
    optional: true
    module: tradeSkill
    source: "ClassicUIForever/Core/Defaults.lua:72 tradeSkill = true"
    note: Also covers the trainer and the professions book (Defaults.lua:71, 73).

  - slot: spellbook.frame
    aspect: style
    via: retexture
    kind: modify
    optional: true
    module: talents
    source: "ClassicUIForever/Core/Defaults.lua:76 talents = true"

modules:
  ui.actionbar.layout:
    title: Classic action bar
    default: true
  minimap.layout:
    title: Classic minimap
    default: true
  tooltip.frame:
    title: Classic tooltips
    default: true
  chat.frame:
    title: Classic chat
    default: true
  quest.tracker:
    title: Classic quest watch
    default: true
  profession.frame:
    title: Classic profession windows
    default: true
  spellbook.frame:
    title: Classic spellbook and talents
    default: true

unknown:
  - >
    ClassicUI declares four interface numbers in one .toc (16001, 120100,
    120105, 120107), so "one manifest per .toc" does not give one manifest per
    game version here. The entries above are read against Forever (16001); which
    of them hold for the other three is unverified, and the per-entry
    'interface' narrowing can record the answer once someone checks.
  - >
    The theme has far more switches than the slots can express: Core/Defaults.lua
    holds over a hundred, down to individual micro buttons (hideMicroShop,
    hideMicroJournal) and theme variants (bronze, dark, custom). Only the
    switches that decide whether a slot is touched at all are modelled. That is
    the right cut, but it means a quality review cannot tell from the manifest
    whether a given switch is on.
