# Hand-written manifest, phase 2. Read against ClassicUI Forever 0.41.1.
#
# ClassicUI restores the Classic look, and almost every part is a separate
# toggle that defaults to on. It retextures existing Blizzard frames rather than
# replacing them - except for the action bar and the quest watch, where it
# supplies frames of its own. Art/ThemeParts.lua holds its own module-to-frame
# table, which is exactly the mapping this project is building in mapping/.
format: 1
addon: ClassicUIForever
toc: ClassicUIForever.toc
versions: ">=0.41.0"
interface: [16001, 120100, 120105, 120107]
title: ClassicUI Forever

provides:
  - slot: ui.skin
    via: retexture
    kind: modify
    source: "ClassicUIForever/Art/ThemeParts.lua:99 PART_KEYS"
    note: >
      The theme as a whole. Claimed because two addons that restyle the entire
      interface are a conflict regardless of their module settings; the
      individual parts below say what is actually touched.

  - slot: ui.actionbar.layout
    via: replace-frame
    kind: replace
    optional: true
    module: classicBar
    source: "ClassicUIForever/Art/GameArt.lua:275 classicBar: MainActionBar, BagsBar, MicroMenuContainer, StatusTrackingBarManager"
    note: The gryphon bar. On by default (Core/Defaults.lua:7).

  - slot: ui.unitframe.player
    via: retexture
    kind: modify
    optional: true
    module: themePartUnits
    source: "ClassicUIForever/Art/ThemeParts.lua:77 themePartUnits: PlayerFrame"

  - slot: ui.unitframe.target
    via: retexture
    kind: modify
    optional: true
    module: themePartUnits
    source: "ClassicUIForever/Art/ThemeParts.lua:77 themePartUnits: TargetFrame, TargetFrameToT"

  - slot: ui.unitframe.party
    via: retexture
    kind: modify
    optional: true
    module: themePartUnits
    source: "ClassicUIForever/Art/ThemeParts.lua:77 themePartUnits: PartyFrame"

  - slot: ui.castbar
    via: retexture
    kind: modify
    optional: true
    module: themePartCastBars
    source: "ClassicUIForever/Art/ThemeParts.lua:79 themePartCastBars"

  - slot: ui.nameplates
    via: retexture
    kind: modify
    optional: true
    module: themePartNameplates
    source: "ClassicUIForever/Art/ThemeParts.lua:64 NamePlate%d -> themePartNameplates"

  - slot: minimap.layout
    via: retexture
    kind: modify
    optional: true
    module: themePartMinimap
    source: "ClassicUIForever/Art/ThemeParts.lua:81 themePartMinimap: MinimapCluster, Minimap"
    note: >
      Also adds a frame of its own, ForeverClassicUIMinimapBag, inside the
      cluster.

  - slot: ui.micromenu
    via: retexture
    kind: modify
    optional: true
    module: themePartMicroMenu
    source: "ClassicUIForever/Art/ThemeParts.lua:84 themePartMicroMenu"

  - slot: ui.bagbar
    via: retexture
    kind: modify
    optional: true
    module: themePartBagBar
    source: "ClassicUIForever/Art/ThemeParts.lua:85 themePartBagBar"

  - slot: ui.xpbar
    via: retexture
    kind: modify
    optional: true
    module: themePartXPBars
    source: "ClassicUIForever/Art/ThemeParts.lua:86 themePartXPBars"

  - slot: tooltip.frame
    via: retexture
    kind: modify
    optional: true
    module: themePartTooltips
    source: "ClassicUIForever/Art/ThemeParts.lua:88 themePartTooltips: GameTooltip and the shopping tooltips"

  - slot: chat.frame
    via: retexture
    kind: modify
    optional: true
    module: themePartChat
    source: "ClassicUIForever/Art/ThemeParts.lua:63 ChatFrame%d -> themePartChat, and :89"

  - slot: quest.tracker
    via: replace-frame
    kind: replace
    optional: true
    module: themePartQuestTracker
    source: "ClassicUIForever/Art/ThemeParts.lua:90 themePartQuestTracker: ObjectiveTrackerFrame, ForeverClassicUIQuestWatch"
    note: >
      Supplies its own watch frame, so this is a replacement rather than a
      retexture. Addons that only write lines into the tracker occupy
      quest.tracker.lines and are unaffected.

  - slot: profession.frame
    via: retexture
    kind: modify
    optional: true
    module: tradeSkill
    source: "ClassicUIForever/Core/Defaults.lua:72 tradeSkill = true"
    note: Also covers the trainer and the professions book (Defaults.lua:71, 73).

  - slot: spellbook.frame
    via: retexture
    kind: modify
    optional: true
    module: talents
    source: "ClassicUIForever/Core/Defaults.lua:76 talents = true"

modules:
  ui.actionbar.layout:
    title: Classic action bar
    default: true
  ui.unitframe.player:
    title: Classic unit frames
    default: true
  ui.unitframe.target:
    title: Classic unit frames
    default: true
  ui.unitframe.party:
    title: Classic unit frames
    default: true
  ui.castbar:
    title: Classic cast bars
    default: true
  ui.nameplates:
    title: Classic nameplates
    default: true
  minimap.layout:
    title: Classic minimap
    default: true
  ui.micromenu:
    title: Classic micro menu
    default: true
  ui.bagbar:
    title: Classic bag bar
    default: true
  ui.xpbar:
    title: Classic experience bars
    default: true
  tooltip.frame:
    title: Classic tooltips
    default: true
  chat.frame:
    title: Classic chat
    default: true
  quest.tracker:
    title: Classic quest watch
    default: true
  profession.frame:
    title: Classic profession windows
    default: true
  spellbook.frame:
    title: Classic spellbook and talents
    default: true

unknown:
  - >
    Module defaults are not expressible where they matter. Every '?' entry here
    defaults to on, so in practice ClassicUI does occupy these slots on a fresh
    install - but the format treats '?' as "ask at runtime", and the checker
    assumes enabled when the addon reports nothing. For an addon whose parts
    default to off (OpenMap's routes and minimap button) that assumption is
    wrong in the opposite direction. The 'default' field in modules records the
    truth but has no effect on any verdict. Candidate for v0.2.
  - >
    Retexturing is not modify. Changing a frame's textures is recorded here as
    kind: modify with via: retexture, which is the closest the format allows,
    but it does not collide the way a value change does: ClassicUI retexturing
    the minimap and MoveAny moving it are genuinely compatible, and the test
    oracle says so. Either retexture becomes an interaction kind of its own, or
    the verdict rules have to read 'via' as well as 'kind'.
  - >
    ui.skin overlaps the parts it contains. Claiming ui.skin and
    ui.unitframe.player at once states the same thing twice, and nothing in the
    format says the first contains the second. A slot hierarchy - occupying a
    parent implies its children - would remove the duplication and would also
    answer whether MoveAny's 115 unlisted frames need slots at all.
  - >
    ClassicUI declares four interface numbers in one .toc (16001, 120100,
    120105, 120107), so "one manifest per .toc" does not in fact give one
    manifest per game version here. The versions it supports and the slots it
    occupies may differ across those four.
