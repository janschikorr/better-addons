# Hand-written manifest, phase 2. Every entry has a source; nothing is inferred
# from the addon's description. Read against OpenMap v0.7.5-beta.
format: 1
addon: OpenMap
toc: OpenMap.toc
versions: ">=0.7.5"
interface: [16001]
title: OpenMap
notes: >
  One stitched world map. OpenMap owns the artwork and the view, and
  deliberately leaves the window, other addons' pins and the quest log alone -
  it carries a compatibility module (Map/Compat.lua) that lifts foreign pins
  above its own artwork.

provides:
  - slot: map.art
    via: stitched
    kind: replace
    source: "OpenMap/Map/Compat.lua:2 on the stitched map the map art and the view are OpenMap's"
    note: >
      Hides the artwork of HighFidelityWorldMap, BetterMaps and HiddenMaps
      while the stitched map shows, and restores it on other maps.

  - slot: map.view
    via: stitched
    kind: replace
    source: "OpenMap/Map/Compat.lua:14 their view changes and their zoom steps don't apply there"

  - slot: map.window
    via: native
    kind: modify
    source: "OpenMap/Map/Window.lua:198 SetupWindow"
    note: >
      Title bar, resize grips and a remembered place. Stands down entirely when
      MoveAny is installed (Window.lua:200, 216) - see the unknown list below.

  - slot: map.label
    via: native
    kind: replace
    source: "OpenMap/Map/Extras.lua:26 labelProvider, Blizzard's area label"
    note: >
      Leatrix Maps replaces the same script at login; OpenMap sets it again
      afterwards (Compat.lua:163 Reassert).

  - slot: map.coords
    via: native
    kind: add
    source: "OpenMap/Map/Extras.lua:19 d.coords = true"
    note: On by default. Reads Blizzard's coordinate CVars back off.

  - slot: map.pins
    via: HereBeDragons
    kind: modify
    source: "OpenMap/Map/Extras.lua:9 other addons' pins through HereBeDragons"
    note: >
      Does not place its own pins this way - it makes foreign HereBeDragons
      pins work on the stitched map, and hides them briefly while zooming
      (Extras.lua:23 d.zoomHidePins).

  - slot: map.pins
    via: native
    kind: add
    source: "OpenMap/Map/Quests.lua:5 C_QuestLog.GetQuestsOnMap, OpenMap's own icons"
    note: Quest icons for every stitched zone, in the look of Blizzard's.

  - slot: map.route
    via: native
    kind: add
    optional: true
    module: routes
    source: "OpenMap/Map/Routes.lua:2 boat and zeppelin routes (off until turned on)"

  - slot: journal.dungeon.pins
    via: native
    kind: add
    source: "OpenMap/Map/Dungeons.lua:1297 C_EncounterJournal.GetDungeonEntrancesForMap"

  - slot: minimap.button
    via: native
    kind: add
    optional: true
    module: minimap.button
    source: "OpenMap/Map/Launcher.lua:13 d.minimapButton = false"
    note: Off by default.

  - slot: cvar.map
    via: SetCVar
    kind: modify
    source: "OpenMap/Map/Extras.lua:27 SetCVarSafe"
    note: >
      Holds off mapFade in favour of its own fade, and turns Blizzard's
      worldMapShowPlayerCoords and worldMapShowCursorCoords back off while its
      own readout is on (Compat.lua:167 OnCVar).

  # Slots OpenMap offers to other addons (OpenMapAPI, API.lua:22, version 4).
  - slot: openmap:api.position
    kind: add
    source: "OpenMap/API.lua:39 WorldFromMap, MapFromWorld, CanvasFromWorldPos"
    note: Converting between stitched-world and uiMap coordinates.
  - slot: openmap:api.view
    kind: add
    source: "OpenMap/API.lua:86 GetView, ShowWorld, and the ViewChanged callback"
  - slot: openmap:menu.toggle
    kind: add
    source: "OpenMap/API.lua:109 RegisterMenuToggle"
    note: Another addon can put its own switch into OpenMap's menu.
  - slot: openmap:dungeon.section
    kind: add
    source: "OpenMap/API.lua:123 RegisterDungeonSection"
  - slot: openmap:townsfolk.provider
    kind: add
    source: "OpenMap/API.lua:136 RegisterTownsfolkProvider"
    note: An NPC database in Questie's shape, for players without Questie.

recommends:
  - addon: Questie
    note: Supplies the dungeon quests and the townsfolk database.
    source: "OpenMap/Map/Dungeons.lua:1334 QuestieLoader, ImportModule QuestieDB"
  - addon: ForeverDungeonJournal
    note: Entrances can open its page; it supplies dungeon quests as an alternative to Questie.
    source: "OpenMap/Map/Dungeons.lua:1074 ForeverDungeonJournal_NS"
  - slot: data.quests
    via: bundled
    note: Any of Questie, Dungeon Journal or NeedRoll will do.
    source: "OpenMap/Map/Dungeons.lua:1345 have = { questie, journal, needroll }"

breaks:
  - addon: Mapster
    reason: Both change the world map; OpenMap says so once at login and cannot reconcile them.
    source: "OpenMap/Map/Compat.lua:190 is also changing the world map"
  - addon: Magnify
    reason: Same as Mapster.
    source: "OpenMap/Map/Compat.lua:190"
  - addon: EnhanceQoL
    reason: Its Mover sizes and places the map too, and the two fight over its scale.
    source: "OpenMap/Map/Window.lua:201 Enhance QoL's Mover (World Map)"

modules:
  map.route:
    title: Boat and zeppelin routes
    default: false
  minimap.button:
    title: Minimap button
    default: false

# Statements the format cannot express yet. Phase 8 decides what to add.
unknown:
  - >
    Conditional occupation: OpenMap claims map.window only while MoveAny is
    absent, and stands down completely when it is installed
    (Window.lua:200, 216). The format can express "only while my own module is
    on" ('?') but not "only while another addon is away". Candidate for v0.2:
    a yields-to statement, which would turn a predicted conflict into a
    predicted handover.
  - >
    Partial conflict: Leatrix Maps is compatible in general - OpenMap lifts its
    pins above the stitched artwork - but three of its options (Unlock map
    frame, Scale the map, Simple map frame) and its coordinate readout do
    clash, and OpenMap names them at login (Compat.lua:175 Warn). Breaks is all
    or nothing, so this is currently recorded nowhere.
  - >
    Duplicated function without a slot conflict: OpenMap's dungeon cards
    (Map/Dungeons.lua, with map, bosses and a quests tab) overlap in purpose
    with Aegis Instance Journal and ForeverDungeonJournal without claiming
    journal.dungeon, because they live on the map rather than replacing a
    frame. The slot model sees no conflict here, and in technical terms there
    is none - but this is exactly the "yet another addon for the same thing"
    case the project wants to make visible.
  - >
    Pin lifting as an interaction kind: Compat.lua changes other addons' frame
    levels (Leatrix Maps, Azeroth Tripview, Books on Map Forever, RareScanner)
    so their pins stay visible. That is neither replace, hook, add nor
    modify of a slot the addon owns - it is maintenance work on a foreign
    addon's frames, and arguably the most compatibility-minded thing in the
    whole test set.
