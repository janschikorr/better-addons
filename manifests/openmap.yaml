# Hand-written manifest, phase 2, format 2. Every entry has a source; nothing is
# inferred from the addon's description. Read against OpenMap v0.7.5-beta.
format: 2
addon: OpenMap
toc: OpenMap.toc
versions: ">=0.7.5"
interface: [16001]
title: OpenMap
notes: >
  One stitched world map. OpenMap owns the artwork and the view, and leaves the
  window to MoveAny where that is installed. Map/Compat.lua also raises the
  frame levels of Leatrix Maps, Azeroth Tripview, Books on Map Forever and
  RareScanner so their pins stay visible above the stitched artwork - deliberate
  maintenance of other addons' frames, which by SPEC.md section 9 is recorded
  here rather than as an occupied slot.

provides:
  - slot: map.art
    aspect: content
    via: stitched
    kind: replace
    source: "OpenMap/Map/Compat.lua:2 on the stitched map the map art and the view are OpenMap's"
    note: >
      Hides the artwork of HighFidelityWorldMap, BetterMaps and HiddenMaps while
      the stitched map shows, and restores it on other maps.

  - slot: map.view
    aspect: behaviour
    via: stitched
    kind: replace
    source: "OpenMap/Map/Compat.lua:14 their view changes and their zoom steps don't apply there"

  - slot: map.window
    aspect: geometry
    kind: modify
    source: "OpenMap/Map/Window.lua:198 SetupWindow"
    reason: >
      Title bar, resize grips and a remembered place, for players without a
      dedicated mover. Dropped entirely when MoveAny is present - see yields_to.

  - slot: map.label
    aspect: content
    via: native
    kind: replace
    source: "OpenMap/Map/Extras.lua:26 labelProvider, Blizzard's area label"
    note: >
      Leatrix Maps replaces the same script at login; OpenMap sets it again
      afterwards (Compat.lua:163 Reassert).

  - slot: map.coords
    aspect: content
    via: native
    kind: add
    optional: true
    module: coords
    source: "OpenMap/Map/Extras.lua:19 d.coords = true"

  - slot: map.pins
    aspect: content
    via: native
    kind: add
    source: "OpenMap/Map/Quests.lua:5 C_QuestLog.GetQuestsOnMap, OpenMap's own icons"
    note: Quest icons for every stitched zone, in the look of Blizzard's.

  - slot: map.route
    aspect: content
    via: native
    kind: add
    optional: true
    module: routes
    source: "OpenMap/Map/Routes.lua:2 boat and zeppelin routes (off until turned on)"

  - slot: journal.dungeon.pins
    aspect: content
    via: native
    kind: add
    source: "OpenMap/Map/Dungeons.lua:1297 C_EncounterJournal.GetDungeonEntrancesForMap"

  - slot: minimap.button
    aspect: content
    via: native
    kind: add
    optional: true
    module: minimapButton
    source: "OpenMap/Map/Launcher.lua:13 d.minimapButton = false"

  - slot: cvar.map
    aspect: behaviour
    via: SetCVar
    kind: modify
    source: "OpenMap/Map/Extras.lua:27 SetCVarSafe"
    reason: >
      Holds off the game's mapFade in favour of its own, which never fades under
      the cursor, and keeps Blizzard's coordinate CVars off while its own
      readout is on (Compat.lua:167 OnCVar).

  # Slots OpenMap offers to other addons (OpenMapAPI, API.lua:22, version 4).
  - slot: openmap:api.position
    aspect: content
    kind: add
    source: "OpenMap/API.lua:39 WorldFromMap, MapFromWorld, CanvasFromWorldPos"
  - slot: openmap:api.view
    aspect: content
    kind: add
    source: "OpenMap/API.lua:86 GetView, ShowWorld, and the ViewChanged callback"
  - slot: openmap:menu.toggle
    aspect: content
    kind: add
    source: "OpenMap/API.lua:109 RegisterMenuToggle"
  - slot: openmap:dungeon.section
    aspect: content
    kind: add
    source: "OpenMap/API.lua:123 RegisterDungeonSection"
  - slot: openmap:townsfolk.provider
    aspect: content
    kind: add
    source: "OpenMap/API.lua:136 RegisterTownsfolkProvider"
    note: An NPC database in Questie's shape, for players without Questie.

yields_to:
  - addon: MoveAny
    slot: map.window
    aspect: geometry
    complete: true
    reason: The map window is MoveAny's to move and size; OpenMap's title bar, grips and saved place stand down.
    source: "OpenMap/Map/Window.lua:216 if not moveAny then"

recommends:
  - addon: Questie
    note: Supplies the dungeon quests and the townsfolk database.
    source: "OpenMap/Map/Dungeons.lua:1334 QuestieLoader, ImportModule QuestieDB"
  - addon: ForeverDungeonJournal
    note: Entrances can open its page; it supplies dungeon quests as an alternative to Questie.
    source: "OpenMap/Map/Dungeons.lua:1074 ForeverDungeonJournal_NS"
  - slot: data.quests
    via: bundled
    note: Any of Questie, Dungeon Journal or NeedRoll will do.
    source: "OpenMap/Map/Dungeons.lua:1345 have = { questie, journal, needroll }"

breaks:
  - addon: Mapster
    reason: Both change the world map; OpenMap says so once at login and cannot reconcile them.
    source: "OpenMap/Map/Compat.lua:190 is also changing the world map"
  - addon: Magnify
    reason: Same as Mapster.
    source: "OpenMap/Map/Compat.lua:190"
  - addon: EnhanceQoL
    reason: Its Mover sizes and places the map too, and the two fight over its scale.
    source: "OpenMap/Map/Window.lua:201 Enhance QoL's Mover (World Map)"

clashes:
  - addon: Leatrix_Maps
    slot: map.window
    settings: ["Unlock map frame", "Scale the map", "Use simple map frame", "Show coordinates"]
    reason: >
      The two cooperate in general - OpenMap lifts Leatrix's pins above its own
      artwork - but these four options fight OpenMap's window and coordinates.
      OpenMap names them once at login.
    source: "OpenMap/Map/Compat.lua:181 UnlockMap, ScaleWorldMap, SimpleMapFrame, ShowCoords"

modules:
  map.coords:
    title: Coordinate readout
    default: true
  map.route:
    title: Boat and zeppelin routes
    default: false
  minimap.button:
    title: Minimap button
    default: false

unknown:
  - >
    Duplicated function without a slot conflict: OpenMap's dungeon cards
    (Map/Dungeons.lua, with map, bosses and a quests tab) overlap in purpose
    with Aegis Instance Journal and ForeverDungeonJournal without claiming
    journal.dungeon, because they live on the map rather than replacing a frame.
    No verdict rule sees this, and technically there is nothing to see - but it
    is exactly the "yet another addon for the same thing" case the project wants
    to surface. It belongs on the info site, not in the verdict.
