# Hand-written manifest, phase 2, format 2. Read against MoveAny 1.14.5
# (MoveAny.toc, the Forever .toc of seven).
#
# MoveAny is why the aspect axis exists. It occupies no slot in the sense of
# "what this part of the interface shows": it changes where roughly 130 named
# Blizzard frames sit and how large they are, via hooksecurefunc, SetMovable,
# SetPoint and SetScale, and never replaces a frame.
format: 2
addon: MoveAny
toc: MoveAny.toc
versions: ">=1.14.5"
interface: [16001]
title: MoveAny by D4KiR
notes: >
  Every entry here is aspect geometry. Around 115 of the frames it moves - trade,
  mail, auction house, calendar, guild, collections, arena, taxi and so on -
  share no frame with anything else in the test set and so need no slot of their
  own; the hierarchy rule covers them under their parents.

provides:
  - slot: map.window
    aspect: geometry
    kind: modify
    source: "MoveAny/moveframes.lua:5 tinsert(MAFRAMES, \"WorldMapFrame\")"
    note: >
      OpenMap yields this slot to MoveAny (OpenMap/Map/Window.lua:216), so the
      pair is a handover, not a conflict.

  - slot: quest.detail
    aspect: geometry
    kind: modify
    source: "MoveAny/moveframes.lua:3 QuestFrame in MAFRAMES"
    note: >
      DialogueUI replaces this frame's content. By the collision table a
      content replace defeats a foreign geometry entry, so that pair is a
      predicted conflict - the case version 0.1 missed entirely.

  - slot: quest.gossip
    aspect: geometry
    kind: modify
    source: "MoveAny/moveframes.lua:3 GossipFrame in MAFRAMES"

  - slot: quest.log
    aspect: geometry
    kind: modify
    source: "MoveAny/moveframes.lua:3 QuestLogFrame, QuestLogDetailFrame, QuestLogPopupDetailFrame"

  - slot: spellbook.frame
    aspect: geometry
    kind: modify
    source: "MoveAny/moveframes.lua:3 SpellBookFrame, PlayerSpellsFrame"

  - slot: profession.frame
    aspect: geometry
    kind: modify
    source: "MoveAny/moveframes.lua:3 TradeSkillFrame, CraftFrame, ProfessionsFrame"

  - slot: journal.dungeon
    aspect: geometry
    kind: modify
    source: "MoveAny/moveframes.lua:3 EncounterJournal in MAFRAMES"

  - slot: minimap.layout
    aspect: geometry
    kind: modify
    optional: true
    module: MINIMAP
    source: "MoveAny/ele/minimap.lua:6 IsEnabled(\"MINIMAP\", false)"
    note: >
      Hides MinimapToggleButton and MinimapBorderTop, and hooks SetAlpha.
      ClassicUI Forever restyles the same slot; different aspects, so the two
      are compatible.

  - slot: ui.actionbar.layout
    aspect: geometry
    kind: modify
    source: "MoveAny/ele/actionbars.lua:1"

  - slot: ui.unitframe
    aspect: geometry
    kind: modify
    source: "MoveAny/ele/partyframe.lua:1 and ele/arenaenemyframes.lua:1"
    reason: >
      Claimed at the parent, not per frame: MoveAny moves the whole family, and
      the hierarchy rule carries it down to the individual frames.

  - slot: ui.buffs
    aspect: geometry
    kind: modify
    source: "MoveAny/ele/buffbar.lua:1 and ele/debuffbar.lua:1"

  - slot: ui.micromenu
    aspect: geometry
    kind: modify
    source: "MoveAny/ele/micromenu.lua:1"

  - slot: ui.bagbar
    aspect: geometry
    kind: modify
    source: "MoveAny/ele/bagbar.lua:1"

  - slot: chat.frame
    aspect: geometry
    kind: modify
    source: "MoveAny/moveframes.lua:3 ChatConfigFrame, ChannelFrame"

yields_to:
  - addon: ElvUI
    slot: minimap.layout
    aspect: geometry
    complete: true
    reason: ElvUI owns the minimap; MoveAny's minimap element returns immediately.
    source: "MoveAny/ele/minimap.lua:7 if ElvUI then return end"

modules:
  minimap.layout:
    title: Minimap element
    default: false

unknown:
  - >
    MoveAny declares the same frame lists for every game version and filters
    them at runtime (moveframes.lua:17 MAFRAMESONLYRETAIL, :23
    MAFRAMESNOTRETAIL, :31 MAIsFrameForBuild). Its real behaviour is decided by
    GetWoWBuild() at load time, not by which .toc the client picked, so neither
    the per-.toc rule nor the per-entry 'interface' narrowing covers it. Open
    for v0.3.
