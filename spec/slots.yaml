# Better Addons - slot registry
#
# Version 0.1. Deliberately limited to the slots touched by the thirteen test
# addons, plus console variables (CVars), audio and automation actions.
# The registry grows after phase 2 (hand-written manifests).
#
# Fields per slot:
#   area        interface area, used for grouping on the info site
#   title       short label
#   exclusive   true  = only one addon can occupy it meaningfully PER ASPECT.
#                       Two addons on the same slot touching different aspects
#                       (one moves it, one restyles it) do not collide.
#               false = additive, several addons possible
#   aspects     the aspects that are meaningful here; informational, a manifest
#               may name others
#   ways        known ways (slot=way). "native" means: straight through the
#               game API, without a library.
#   note        what the slot stands for, and how a conflict becomes visible

format: 2
version: "0.2"

areas:
  map: World map
  minimap: Minimap
  quest: Quests and dialogue
  tooltip: Tooltips
  spellbook: Spellbook and talents
  profession: Professions
  journal: Reference frames
  ui: Overall interface
  chat: Chat
  audio: Audio output
  cvar: Console variables
  auto: Automation actions
  data: Data sources

slots:

  # ---------------------------------------------------------------- World map
  map.window:
    area: map
    title: World map frame
    exclusive: true
    ways: [native, replace-frame]
    note: >
      The frame itself: size, position, title bar, resize grips. Separate from
      what is drawn inside it. Two providers means the window jumps between
      two remembered places, or fights over its scale.

  map.art:
    area: map
    title: Map artwork
    exclusive: true
    ways: [native, stitched, overlay]
    note: >
      What the canvas shows: the zone image, terrain, stitched continents. The
      loser of this slot draws underneath the winner and is simply not seen -
      its work still costs frame time. Separated from map.window after reading
      OpenMap, which owns the artwork while deliberately leaving the window to
      another addon.

  map.view:
    area: map
    title: Map view and zoom
    exclusive: true
    ways: [native, stitched]
    note: >
      Where the view sits and how far it zooms, including remembered zoom per
      map and jumps to a location. Two providers means the view snaps back and
      forth while panning.

  map.label:
    area: map
    title: Zone label on the map
    exclusive: true
    ways: [native]
    note: >
      Blizzard's area label, naming the zone under the cursor. Replacing its
      script is the usual way in, so the addon that does it last wins - which
      makes the result depend on login order.

  map.coords:
    area: map
    title: Coordinate readout
    exclusive: true
    ways: [native, SetCVar]
    note: >
      Player and cursor coordinates on the map. Two providers means two
      readouts, often overlapping in the same corner.

  map.pins:
    area: map
    title: Pins on the world map
    exclusive: false
    ways: [native, HereBeDragons, embedded-copy, custom-overlay]
    note: >
      Quest, gathering and target pins. Additive as long as everyone uses the
      same way. A custom overlay on top of a foreign map drifts if that map
      computes coordinates differently.

  map.route:
    area: map
    title: Routes drawn on the map
    exclusive: false
    ways: [native, HereBeDragons, custom-overlay]
    note: Lines and paths drawn between points.

  map.filter:
    area: map
    title: Map filter bar
    exclusive: false
    ways: [native]
    note: Extra checkboxes and dropdowns on the map edge.

  map.legend:
    area: map
    title: Map legend
    exclusive: false
    ways: [native]
    note: Entries in the map's legend or key.

  # ------------------------------------------------------------------ Minimap
  minimap.layout:
    area: minimap
    title: Minimap shape and position
    exclusive: true
    ways: [native, replace-frame, retexture]
    note: >
      Shape, size, position, border and button ring. Two providers means
      displaced or duplicated buttons.

  minimap.pins:
    area: minimap
    title: Pins on the minimap
    exclusive: false
    ways: [native, HereBeDragons, embedded-copy, custom-overlay]

  minimap.button:
    area: minimap
    title: Button on the minimap ring
    exclusive: false
    ways: [native, LibDBIcon, LibDataBroker]
    note: Additive, but every button costs space. A common source of slop.

  # ------------------------------------------------------- Quests, dialogue
  quest.tracker:
    area: quest
    title: Objective tracker frame
    exclusive: true
    ways: [native, replace-frame]
    note: >
      Who owns the tracker frame itself. Addons that only write lines into it
      occupy quest.tracker.lines instead.

  quest.tracker.lines:
    area: quest
    title: Lines inside the objective tracker
    exclusive: false
    ways: [native, custom-block]
    note: >
      Extra lines and blocks. Additive, but with limited height the blocks
      push each other out of view.

  quest.detail:
    area: quest
    title: Quest frame (accept and turn in)
    exclusive: true
    ways: [native, replace-frame]
    note: >
      The frame holding quest text. Whoever replaces it must keep the events
      readable, or text-to-speech addons go silent.

  quest.gossip:
    area: quest
    title: Gossip frame
    exclusive: true
    ways: [native, replace-frame]

  quest.log:
    area: quest
    title: Quest log
    exclusive: true
    ways: [native, replace-frame]

  quest.objectives:
    area: quest
    title: Quest objective data
    exclusive: false
    ways: [native]
    note: Reading objectives and offering them to other addons.

  # ------------------------------------------------------------------ Tooltips
  tooltip.lines:
    area: tooltip
    title: Extra tooltip lines
    exclusive: false
    ways: [native, TooltipDataProcessor]

  # ----------------------------------------- Spellbook, talents, professions
  spellbook.frame:
    area: spellbook
    title: Spellbook frame
    exclusive: true
    ways: [native, replace-frame, retexture]

  spellbook.tab:
    area: spellbook
    title: Extra tab or button on the spellbook
    exclusive: false
    ways: [native]

  profession.frame:
    area: profession
    title: Profession frame
    exclusive: true
    ways: [native, replace-frame, retexture]

  profession.sidebar:
    area: profession
    title: Sidebar in the profession frame
    exclusive: false
    ways: [native, custom-overlay]

  profession.recipe.lines:
    area: profession
    title: Extra information on recipes
    exclusive: false
    ways: [native]
    note: For example colouring by skill-up chance.

  # --------------------------------------------------------- Reference frames
  journal.dungeon:
    area: journal
    title: Dungeon journal
    exclusive: true
    ways: [native, standalone-frame]
    note: >
      A standalone frame, or a replacement for Blizzard's journal. Several
      standalone journals are not a technical conflict, but they are duplicated
      effort - exactly what the slot registry is meant to make visible.

  journal.dungeon.pins:
    area: journal
    title: Dungeon entrances on the map
    exclusive: false
    ways: [native, custom-overlay]

  # ------------------------------------------------------ Overall interface
  ui:
    area: ui
    title: The interface as a whole
    exclusive: true
    ways: [replace-frame, retexture, native]
    note: >
      The parent of every ui.* slot. An addon that owns the whole appearance
      claims this one, and by the hierarchy rule (SPEC.md 3.5) that includes
      every part below it - no need to list them twice. Two addons claiming it
      on the same aspect are always a conflict; one claiming it for style and
      another for geometry are not.

  ui.unitframe:
    area: ui
    title: Unit frames as a group
    exclusive: true
    ways: [native, replace-frame, retexture]
    note: Parent of the individual unit frame slots.

  ui.unitframe.player:
    area: ui
    title: Player frame
    exclusive: true
    ways: [native, replace-frame, retexture]

  ui.unitframe.target:
    area: ui
    title: Target frame
    exclusive: true
    ways: [native, replace-frame, retexture]

  ui.unitframe.party:
    area: ui
    title: Party frames
    exclusive: true
    ways: [native, replace-frame, retexture]

  ui.actionbar.layout:
    area: ui
    title: Action bar layout
    exclusive: true
    ways: [native, replace-frame, retexture]

  ui.castbar:
    area: ui
    title: Cast bars
    exclusive: true
    ways: [native, replace-frame, retexture]

  ui.nameplates:
    area: ui
    title: Nameplates
    exclusive: true
    ways: [native, replace-frame, retexture]

  ui.micromenu:
    area: ui
    title: Micro menu
    exclusive: true
    ways: [native, replace-frame, retexture]
    note: The row of small buttons for character, spellbook, quest log and so on.

  ui.bagbar:
    area: ui
    title: Bag bar
    exclusive: true
    ways: [native, replace-frame, retexture]

  ui.buffs:
    area: ui
    title: Buff and debuff bars
    exclusive: true
    ways: [native, replace-frame, retexture]

  ui.xpbar:
    area: ui
    title: Experience and reputation bars
    exclusive: true
    ways: [native, replace-frame, retexture]

  tooltip.frame:
    area: tooltip
    title: Tooltip appearance
    exclusive: true
    ways: [native, retexture]
    note: >
      The look of the tooltip frame itself. Separate from tooltip.lines, which
      several addons can add to at once.

  chat.frame:
    area: chat
    title: Chat frame
    exclusive: true
    ways: [native, replace-frame, retexture]

  chat.message:
    area: chat
    title: Filtering or extending chat messages
    exclusive: false
    ways: [native]

  # -------------------------------------------------------------------- Audio
  audio.tts:
    area: audio
    title: Speaking text aloud
    exclusive: true
    ways: [native, SpeakText]
    note: >
      Reading quest and gossip text aloud. Two providers talk at the same time -
      audible and unambiguous, which is why it is one of the negative controls.

  audio.sound:
    area: audio
    title: Additional sounds
    exclusive: false
    ways: [native, bundled]

  audio.mute:
    area: audio
    title: Muting game sounds
    exclusive: false
    ways: [MuteSoundFile]
    note: Additive, but two addons can undo each other when unmuting.

  # ------------------------------------------------------- Console variables
  cvar.nameplate:
    area: cvar
    title: Nameplate settings
    exclusive: true
    ways: [SetCVar]
    note: >
      CVars are global. Two addons writing the same CVar overwrite each other on
      every load, so the resulting state depends on load order.

  cvar.camera:
    area: cvar
    title: Camera settings
    exclusive: true
    ways: [SetCVar]

  cvar.map:
    area: cvar
    title: Map settings
    exclusive: true
    ways: [SetCVar]

  cvar.audio:
    area: cvar
    title: Sound settings
    exclusive: true
    ways: [SetCVar]

  # -------------------------------------------------------- Automation actions
  auto.quest.accept:
    area: auto
    title: Accepting quests automatically
    exclusive: true
    ways: [native]
    note: >
      Two addons both accepting produce duplicate calls and skipped dialogue.

  auto.quest.turnin:
    area: auto
    title: Turning in quests automatically
    exclusive: true
    ways: [native]

  auto.gossip.select:
    area: auto
    title: Selecting gossip options automatically
    exclusive: true
    ways: [native]

  auto.loot:
    area: auto
    title: Automatic looting
    exclusive: true
    ways: [native, SetCVar]

  # ------------------------------------------------------------ Data sources
  data.zones:
    area: data
    title: Zone and coordinate data
    exclusive: false
    ways: [bundled]

  data.quests:
    area: data
    title: Quest database
    exclusive: false
    ways: [bundled]
    note: >
      Bundled databases. Several are not a conflict, but they duplicate memory
      and maintenance. Naming source and licence is mandatory.

  data.items:
    area: data
    title: Item and recipe data
    exclusive: false
    ways: [bundled]

  # Added in bundle 3. Aegis Instance Journal sets a key binding by itself when
  # the player has none (Core/Init.lua:51 SetBinding(DEFAULT_KEY, BINDING)), and
  # two addons both reaching for Shift-J is a conflict no UI slot describes.
  keybinding:
    area: input
    title: Key bindings claimed automatically
    exclusive: false
    ways: [native]
    note: >
      The real unit here is the single key, not the slot: two addons that each
      bind a key only conflict when it is the same key. Recorded as one
      non-exclusive slot, with the key named in the entry's note, until the
      format can carry a parameter. See spec/CHANGELOG.md.

  trainer.frame:
    area: trainer
    title: Class trainer window
    exclusive: true
    ways: [native, replace-frame, retexture]

  trainer.list:
    area: trainer
    title: Rows in the class trainer window
    exclusive: false
    ways: [native, custom-overlay]
