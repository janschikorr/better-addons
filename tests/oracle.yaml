# Better Addons - test oracle
#
# For every critical pair, the expected verdict is written down BEFORE the test
# runs. Only then is a match evidence rather than hindsight.
#
# verdict: conflict | incompatible | compatible | open
#   "open" means the code decides, in phase 2. Every row must carry a fixed
#   verdict before phase 7 (in-game testing) starts.
#
# Fields:
#   pair      the two (or more) addons involved
#   verdict   the prediction
#   why       the reason, in one sentence
#   observe   what to look at in the game to confirm or refute it
#   result    filled in during phase 7: confirmed | deviated, plus a note

format: 1
version: "0.2"

addons:
  under_test:
    - OpenMap
    - Questie
    - Overlord_Forever
    - DFL_DungeonJournal
    - ShortestPathForever
    - ClassicUI_Forever
    - DialogueUI
    - Spoken
    - SkillUpForever
    - WhatsTraining_Forever
  controls:
    - addon: Leatrix_Maps
      role: conflict control
      why: Claims the world map frame like OpenMap; OpenMap warns about it itself.
    - addon: Forever_TTS
      role: duplicate-function control
      why: Reads quests aloud like Spoken.
  tooling:
    - BugGrabber
    - BugSack

pairs:
  - pair: [OpenMap, Leatrix_Maps]
    verdict: clash
    settings: ["Unlock map frame", "Scale the map", "Use simple map frame", "Show coordinates"]
    why: >
      Not a plain conflict. OpenMap cooperates with Leatrix Maps and lifts its
      pins above the stitched artwork; only these four Leatrix options fight it.
      The original prediction of "conflict" was changed after reading
      OpenMap/Map/Compat.lua:181 - it was not decidable as written, because with
      those options off the pair simply works.
    observe: >
      With the four options off: both addons active, Leatrix pins visible on the
      stitched map, no warning beyond OpenMap's login note. With any of them on:
      OpenMap names it at login, and the map window or coordinates misbehave.
    result: null

  - pair: [OpenMap, MoveAny]
    verdict: handover
    why: OpenMap yields map.window to MoveAny (OpenMap/Map/Window.lua:216).
    observe: >
      OpenMap shows no title bar or resize grips; MoveAny moves and sizes the
      map window, and the position survives a reload.
    result: null

  - pair: [ClassicUI_Forever, MoveAny]
    verdict: compatible
    why: >
      ClassicUI restyles the minimap, MoveAny moves it - different aspects on
      the same slot. Version 0.1 predicted a conflict here, which was the clearest
      false positive in the first draft.
    observe: Classic minimap art in the place MoveAny put it, both intact.
    result: null

  - pair: [DialogueUI, MoveAny]
    verdict: conflict
    why: >
      DialogueUI replaces the quest frame's content while MoveAny moves the
      original. A content replace defeats a foreign geometry entry. Version 0.1
      did not flag this at all.
    observe: >
      Whether MoveAny's saved position applies to the DialogueUI frame, and
      whether the native quest frame still appears anywhere.
    result: null

  - pair: [Spoken, Forever_TTS]
    verdict: conflict
    why: Both read quests aloud.
    observe: Warning appears; without a choice, both speak at once.
    result: null

  - pair: [OpenMap, Questie]
    verdict: compatible
    why: OpenMap displays Questie pins deliberately.
    observe: Quest icons visible on the OpenMap canvas.
    result: null

  - pair: [OpenMap, Overlord_Forever]
    verdict: compatible
    risk: layering
    why: >
      Settled by reading the code: Overlord draws its zone circles as its own
      overlays on a visible layer (Overlord/MapMarkers.lua:1), and OpenMap's
      map.pins is additive, so the rules say compatible. But OpenMap lifts
      foreign overlays above its stitched artwork one addon at a time, by name,
      and Overlord is not in that list (OpenMap/Map/Compat.lua:34-140). The
      prediction is therefore compatible with a specific visual risk: the
      circles may be drawn underneath the stitched art and simply not show.
    observe: >
      With stitching ON: are the front circles visible at all? With stitching
      OFF (a dungeon or battleground map): are they visible there? If they show
      only with stitching off, the rules were right and the verdict is still
      wrong in practice - which is the most useful thing this test can find.
    result: null

  - pair: [OpenMap, DFL_DungeonJournal]
    verdict: open
    why: Entrance pins, way not yet known.
    observe: Dungeon entrances on the OpenMap canvas.
    result: null

  - pair: [OpenMap, ShortestPathForever]
    verdict: open
    why: The route is drawn onto the map, way not yet known.
    observe: Route visible on the OpenMap canvas.
    result: null

  - pair: [Questie, ShortestPathForever]
    verdict: compatible
    why: >
      Settled by reading the code. Questie supplies its own tracker frame,
      Questie_BaseFrame (Modules/Tracker/TrackerBaseFrame.lua:33), while
      Shortest Path adds a block to its own column and reads where Questie's
      list sits in order to keep clear of it (UI/TrackerQuestie.lua). Different
      frames, one of them deliberately yielding space.
    observe: >
      Both sets of lines visible, neither covering the other, after dragging
      Questie's tracker to a new position and reloading.
    result: null

  - pair: [Questie, DFL_DungeonJournal]
    verdict: compatible
    why: Both supply quest data; neither owns a slot exclusively.
    observe: Tracker and journal both show their content.
    result: null

  - pair: [DialogueUI, Spoken]
    verdict: open
    why: DialogueUI replaces the quest frame, Spoken speaks when it opens.
    observe: Narration starts inside the DialogueUI frame too.
    result: null

  - pair: [ClassicUI_Forever, Questie]
    verdict: compatible
    why: ClassicUI styles the minimap, Questie only places pins.
    observe: Pins visible on the Classic minimap.
    result: null

  - pair: [ClassicUI_Forever, Overlord_Forever]
    verdict: compatible
    why: ClassicUI styles the minimap, Overlord only places pins.
    observe: Pins visible on the Classic minimap.
    result: null

  - pair: [ClassicUI_Forever, ShortestPathForever]
    verdict: compatible
    why: ClassicUI styles the minimap, Shortest Path only places pins.
    observe: Pins visible on the Classic minimap.
    result: null

  - pair: [ClassicUI_Forever, WhatsTraining_Forever]
    verdict: compatible
    why: Extra button on the spellbook, no claim on the frame itself.
    observe: Button visible and clickable.
    result: null

  - pair: [ClassicUI_Forever, SkillUpForever]
    verdict: compatible
    why: Sidebar inside the profession frame.
    observe: Skill-up values and sidebar visible.
    result: null

  - pair: [Questie, ClassicUI_Forever]
    verdict: conflict
    why: >
      Found by writing the manifests, not predicted in the original plan. Both
      replace the content of quest.tracker: Questie with Questie_BaseFrame
      (Modules/Tracker/TrackerBaseFrame.lua:33) and ClassicUI with
      ForeverClassicUIQuestWatch (Art/ThemeParts.lua:90). Both default to on
      (Questie trackerEnabled, ClassicUI themePartQuestTracker), so this fires
      on a fresh install of the pair.
    observe: >
      Which tracker is visible, whether the other is empty or hidden, and
      whether quest lines appear in only one of them.
    result: null

# Phase 7 step 1 is not a pair but a precondition:
preconditions:
  - name: gamepad cursor survives a native map data provider
    why: >
      War Effort adds a native map canvas data provider
      (WarEffortScout/MapPins.lua:2). Legacy Forever deliberately does not,
      because addon values in the gamepad cursor's secure walk taint its later
      protected calls (LegacyForever/UI/MapCanvas.lua:5-13). One of the two is
      wrong about the risk, and the format cannot decide it.
    observe: >
      With a gamepad active and War Effort loaded, open the world map and use
      the gamepad cursor over pins. If it stops working, Legacy Forever's
      caution is justified and this becomes a quality guide rule with teeth.
    result: null

  - name: saved variables survive logout
    why: >
      A bug seen in the beta. It decides whether the checker addon can persist
      the choices the player makes.
    observe: Set an option, log out, log back in, option is still set.
    result: null
