# instead of the registry's 'standalone-frame' - until tools/validate.py gained
# check_ways. The way decides collisions, so an unlisted way is an unchecked
# claim about how the slot is occupied.
format: 2
addon: ExampleAddon
toc: ExampleAddon.toc
